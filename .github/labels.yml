# Label definitions for Gentleman-Programming/engram
#
# This file is the canonical label set and policy source for this repo.
# `policy` metadata is machine-readable: namespace settings apply to every label
# with that prefix; aliases belong to their canonical replacement label.
# Apply labels via gh CLI (run from repo root, requires write access):
#
#   gh label create "<name>" --color "<hex>" --description "<desc>" --repo Gentleman-Programming/engram
#
# Or use a tool like github-label-sync:
#   npx github-label-sync --labels .github/labels.yml Gentleman-Programming/engram

# --- Type labels (required on every PR — pick exactly one) ---
- name: "type:bug"
  color: "d73a4a"
  description: "Bug fix"
  policy: { namespace: type, owner: maintainers, cardinality: required-singleton, applies_to: [issue, pull-request], deprecated_aliases: [bug], migration_precedence: canonical, migration_conflict: manual-review, protected_exceptions: ["good first issue", "help wanted"] }

- name: "type:feature"
  color: "a2eeef"
  description: "New feature"
  policy: { deprecated_aliases: [enhancement], migration_precedence: canonical, migration_conflict: manual-review }

- name: "type:question"
  color: "d876e3"
  description: "Question requiring issue tracking"
  policy: { deprecated_aliases: [question], migration_precedence: canonical, migration_conflict: manual-review }

- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"

- name: "type:refactor"
  color: "7B68EE"
  description: "Code refactoring (no behavior change)"

- name: "type:chore"
  color: "ededed"
  description: "Maintenance, tooling, dependencies"

- name: "type:breaking-change"
  color: "B60205"
  description: "Breaking change — requires major version bump"

# --- Status labels (set by maintainers) ---
- name: "status:needs-review"
  color: "fbca04"
  description: "Awaiting maintainer review"
  policy: { namespace: status, owner: maintainers, cardinality: optional-singleton, required_on: [issue], applies_to: [issue, pull-request] }

- name: "status:approved"
  color: "0E8A16"
  description: "Approved for implementation"

- name: "status:in-progress"
  color: "1d76db"
  description: "Actively being worked on — exempt from stale bot"

- name: "status:blocked"
  color: "b60205"
  description: "Blocked by another issue or external dependency"

- name: "status:stale"
  color: "ededed"
  description: "No activity for 30 days — auto-applied by stale bot"

- name: "status:wontfix"
  color: "ffffff"
  description: "Intentionally not fixing"

- name: "status:possible-duplicate"
  color: "d876e3"
  description: "Potential duplicate under evaluation"

# --- Resolution labels (set after closure) ---
- name: "resolution:duplicate"
  color: "c5def5"
  description: "Confirmed duplicate after closure"
  policy: { namespace: resolution, owner: maintainers, cardinality: optional-singleton, applies_to: [issue] }

# --- Priority labels (set by maintainers) ---
- name: "priority:high"
  color: "B60205"
  description: "High priority — exempt from stale bot"
  policy: { namespace: priority, owner: maintainers, cardinality: optional-singleton, applies_to: [issue] }

- name: "priority:critical"
  color: "B60205"
  description: "Critical priority — exempt from stale bot"

- name: "priority:medium"
  color: "fbca04"
  description: "Medium priority"

- name: "priority:low"
  color: "0E8A16"
  description: "Low priority"

# --- Effort labels (for contributor guidance) ---
- name: "effort:small"
  color: "d4edda"
  description: "< 1 hour — good for new contributors"
  policy: { namespace: effort, owner: maintainers, cardinality: multi-valued, applies_to: [issue] }

- name: "effort:medium"
  color: "fff3cd"
  description: "1–4 hours"

- name: "effort:large"
  color: "f8d7da"
  description: "> 4 hours or spans multiple files"

# --- Pull request size exceptions (set by maintainers) ---
- name: "size:exception"
  color: "D93F0B"
  description: "Maintainer-approved exception to the 400-line review budget"
  policy: { namespace: size, owner: maintainers, cardinality: optional-singleton, applies_to: [pull-request], protected_exception: true }

# --- Protected unnamespaced exceptions ---
- name: "good first issue"
  color: "7057ff"
  description: "Approachable contribution for new contributors"
  policy: { owner: maintainers, protected_exception: true, applies_to: [issue] }

- name: "help wanted"
  color: "008672"
  description: "Maintainers welcome contributor help"
  policy: { owner: maintainers, protected_exception: true, applies_to: [issue], deprecated_aliases: ["up for grabs"], migration_precedence: canonical, migration_conflict: manual-review }
