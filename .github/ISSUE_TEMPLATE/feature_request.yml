name: Feature Request
description: Suggest a new feature or improvement for engram
labels: ["type:feature", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        # ✨ Feature Request

        Thanks for suggesting an improvement! Help us understand the problem you're solving.

        > **How this works:**
        > 1. You submit this issue → it gets `status:needs-review` automatically
        > 2. A maintainer reviews it → replaces the review status with `status:approved` if accepted
        > 3. Only then can a PR be opened to implement it
        >
        > See [CONTRIBUTING.md](https://github.com/Gentleman-Programming/engram/blob/main/CONTRIBUTING.md) for the full workflow.

  - type: checkboxes
    id: existing-issue-search
    attributes:
      label: Existing Issue Search
      description: Search for a canonical root-cause tracker. Add a new occurrence there; maintainers decide whether roots match.
      options:
        - label: I searched existing issues and will add evidence to a canonical tracker when applicable.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: "🔍 Observed Consequence"
      description: Describe the user problem and impact; do not propose an implementation.
      placeholder: |
        I'm always frustrated when...
        It's currently not possible to...
        Every time I need to X, I have to manually...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 Desired Outcome"
      description: Describe the outcome from the user's perspective, not an implementation.
      placeholder: |
        This would let me...
        A successful outcome would mean...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: "📦 Affected Area"
      description: Which part of engram does this affect?
      options:
        - CLI (commands, flags)
        - MCP Server (tools, transport)
        - TUI (terminal UI)
        - Store (database, queries)
        - Sync (multi-instance)
        - Skills (agent skills)
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: release-context
    attributes:
      label: Release Context
      placeholder: e.g. 0.3.1, main branch, or not release-specific
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Workarounds and Constraints"
      description: Describe workarounds you tried or constraints you observed; do not propose implementation alternatives.
      placeholder: |
        I currently work around this by...
        A constraint I observed is...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "📎 Additional Context"
      description: Any other context, mockups, examples, or references that help explain the request.
    validations:
      required: false
