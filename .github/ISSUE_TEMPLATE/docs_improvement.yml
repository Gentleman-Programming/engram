name: Documentation Improvement
description: Report missing, outdated, or unclear documentation
labels: ["type:docs", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        # 📖 Documentation Improvement

        Found something missing, wrong, or confusing in the docs? Help us improve.

        > **How this works:**
        > 1. You submit this issue → it gets `status:needs-review` automatically
        > 2. A maintainer reviews it → replaces the review status with `status:approved` if accepted
        > 3. Only then should a PR be opened to fix it
        >
        > See [CONTRIBUTING.md](https://github.com/Gentleman-Programming/engram/blob/main/CONTRIBUTING.md) for the full workflow.

  - type: checkboxes
    id: existing-issue-search
    attributes:
      label: Existing Issue Search
      description: Search for a canonical root-cause tracker. Add a new occurrence there; maintainers decide whether roots match.
      options:
        - label: I searched existing issues and will add evidence to a canonical tracker when applicable.
          required: true

  - type: input
    id: doc_reference
    attributes:
      label: "📄 Documentation Reference"
      description: Provide a link to the specific doc page or section that needs improvement.
      placeholder: "e.g. docs/AGENT-SETUP.md#section-name"
    validations:
      required: true

  - type: dropdown
    id: doc_file
    attributes:
      label: "📄 Which Document?"
      description: Where is the documentation issue?
      options:
        - README.md
        - CONTRIBUTING.md
        - docs/INSTALLATION.md
        - docs/AGENT-SETUP.md
        - docs/ARCHITECTURE.md
        - docs/PLUGINS.md
        - docs/COMPARISON.md
        - DOCS.md
        - A skill in skills/
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🔍 Observed Consequence"
      description: Describe what is incorrect, unclear, or absent; do not prescribe the implementation.
      placeholder: |
        The section "X" in docs/AGENT-SETUP.md says "..." but this is incorrect because...
        The README is missing an example for...
    validations:
      required: true

  - type: input
    id: release-context
    attributes:
      label: Release Context
      placeholder: e.g. 0.3.1, main branch, or not release-specific
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: "💡 Desired Outcome"
      description: Describe what readers need to be able to do or understand.
      placeholder: |
        Readers need to be able to...
        The documentation should make clear...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "📎 Additional Context"
      description: Links, screenshots, or anything else that helps.
    validations:
      required: false
