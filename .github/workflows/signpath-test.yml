name: SignPath TEST signing pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/signpath-test.yml
      - .github/signpath/github-test-zip.xml
      - scripts/verify-signpath-test.ps1
      - scripts/verify-signpath-test.tests.ps1
      - signpath_test.go
      - docs/signpath-test.md
      - go.mod
      - go.sum
      - cmd/engram/**
      - internal/**

permissions:
  contents: read
  actions: read

jobs:
  premerge-fixtures:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build test binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOTOOLCHAIN = 'local'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA -or (git status --porcelain --untracked-files=all)) { throw 'Unexpected or dirty checkout' }
          if ((go env GOVERSION) -cne 'go1.26.11') { throw 'Unexpected Go version' }
          $dir = Join-Path $env:RUNNER_TEMP 'signpath-unsigned'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            $file = Join-Path $dir "engram-windows-$arch.exe"
            go build -mod=readonly -trimpath -buildvcs=true -ldflags='-s -w -X main.version=signpath-test' -o $file ./cmd/engram
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $info = @(go version -m $file)
            if ($LASTEXITCODE -ne 0 -or $info -cnotcontains "`tbuild`tvcs.revision=$env:GITHUB_SHA" -or $info -cnotcontains "`tbuild`tvcs.modified=false") { throw 'Invalid build provenance' }
          }
      - name: Test verifier
        shell: pwsh
        run: ./scripts/verify-signpath-test.tests.ps1 -UnsignedDirectory "$env:RUNNER_TEMP\signpath-unsigned"

  signpath-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: signpath-test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Check expected certificate
        shell: pwsh
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_TEST_CERTIFICATE_SHA256 }}
        run: |
          if ($env:EXPECTED_CERTIFICATE_SHA256 -cnotmatch '^[0-9a-fA-F]{64}$') {
            throw 'Set SIGNPATH_TEST_CERTIFICATE_SHA256 to the 64 hexadecimal digit DER certificate SHA256.'
          }
      - name: Build test binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOTOOLCHAIN = 'local'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA -or (git status --porcelain --untracked-files=all)) { throw 'Unexpected or dirty checkout' }
          if ((go env GOVERSION) -cne 'go1.26.11') { throw 'Unexpected Go version' }
          $dir = Join-Path $env:RUNNER_TEMP 'signpath-unsigned'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            $file = Join-Path $dir "engram-windows-$arch.exe"
            go build -mod=readonly -trimpath -buildvcs=true -ldflags='-s -w -X main.version=signpath-test' -o $file ./cmd/engram
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $info = @(go version -m $file)
            if ($LASTEXITCODE -ne 0 -or $info -cnotcontains "`tbuild`tvcs.revision=$env:GITHUB_SHA" -or $info -cnotcontains "`tbuild`tvcs.modified=false") { throw 'Invalid build provenance' }
          }
      - name: Test verifier
        shell: pwsh
        run: ./scripts/verify-signpath-test.tests.ps1 -UnsignedDirectory "$env:RUNNER_TEMP\signpath-unsigned"
      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signpath-test-unsigned
          path: ${{ runner.temp }}\signpath-unsigned\*.exe
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Sign with SignPath
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 538456f4-515b-43d4-99a7-0e75f7825d00
          project-slug: engram
          signing-policy-slug: test-signing
          artifact-configuration-slug: github-test-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signpath-signed
      - name: Verify signed artifacts
        shell: pwsh
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_TEST_CERTIFICATE_SHA256 }}
        run: ./scripts/verify-signpath-test.ps1 -Directory "$env:RUNNER_TEMP\signpath-signed" -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256
      - name: Upload verified test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signpath-test-verified-NOT-FOR-RELEASE
          path: ${{ runner.temp }}\signpath-signed\*.exe
          if-no-files-found: error
          overwrite: false
          retention-days: 7
