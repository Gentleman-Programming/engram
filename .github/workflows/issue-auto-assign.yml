name: Linked Issue Assignment

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]

permissions: {}

# Repository-wide serialization; pending runs may be coalesced, not FIFO.
concurrency:
  group: issue-auto-assign
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Load trusted base helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/issue-auto-assign.mjs
          sparse-checkout-cone-mode: false
      - name: Assign eligible linked issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 0
          script: |
            try {
              const { autoAssign } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-auto-assign.mjs`);
              await autoAssign(github, context, core);
            } catch {
              core.setFailed('Unable to load or run trusted issue assignment helper.');
            }
