name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          only-new-issues: true

  policy-helper-tests:
    name: Policy Helper Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run policy helper tests
        run: node --test .github/scripts/merge-queue.test.mjs .github/scripts/label-policy.test.mjs .github/scripts/transient-artifacts.test.mjs .github/scripts/pr-size-notice.test.mjs

      - name: Run issue policy helper tests
        run: node --test .github/scripts/issue-*.test.mjs

      - name: Verify Windows suite workflow contract
        run: node --test .github/scripts/windows-suite.test.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Verify generated templ output
        run: |
          make templ
          git diff --exit-code -- 'internal/cloud/dashboard/*_templ.go'
          untracked_templ_outputs=$(git ls-files --others --exclude-standard -- 'internal/cloud/dashboard/*_templ.go')
          if [[ -n "${untracked_templ_outputs}" ]]; then
            echo '::error::Untracked generated templ output detected:' >&2
            printf '%s\n' "${untracked_templ_outputs}" >&2
            exit 1
          fi

      - name: Run dead-code ratchet
        run: make deadcode-check

      - name: Run unit tests
        run: go test ./...

      - name: Run binary quick self-test
        run: go build -o engram-selftest ./cmd/engram && ./engram-selftest test --quick

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  # Not a required context during baseline collection. Failures stay visible:
  # do not use continue-on-error or weaken tests to make this job green.
  windows-unit-tests:
    name: Windows Unit Tests (observational)
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Set up Node.js for subprocess fixtures
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Select trusted Windows fixture tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:/Program Files/Git/usr/bin/bash.exe'
          $jq = 'C:/ProgramData/chocolatey/lib/jq/tools/jq.exe'
          $curl = 'C:/Windows/System32/curl.exe'
          $required = @(
            $bash, $jq, $curl,
            'C:/Program Files/Git/usr/bin/cygpath.exe',
            'C:/Program Files/Git/usr/bin/cat.exe',
            'C:/Program Files/Git/usr/bin/dirname.exe',
            'C:/Program Files/Git/usr/bin/chmod.exe'
          )
          foreach ($path in $required) {
            Write-Output "Checking Windows fixture prerequisite: $path"
            if ([System.IO.Path]::GetExtension($path) -ne '.exe' -or
                -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows fixture prerequisite: $path"
            }
          }
          $bashVersion = & $bash --version
          if ($LASTEXITCODE -ne 0) { throw "Version check failed: $bash (exit $LASTEXITCODE)" }
          $jqVersion = & $jq --version
          if ($LASTEXITCODE -ne 0) { throw "Version check failed: $jq (exit $LASTEXITCODE)" }
          $curlVersion = & $curl --version
          if ($LASTEXITCODE -ne 0) { throw "Version check failed: $curl (exit $LASTEXITCODE)" }
          $evidence = @("Trusted Bash: $bash", $bashVersion, "Trusted jq: $jq", $jqVersion, "Trusted curl: $curl", $curlVersion)
          $evidence | Write-Output
          @('## Windows fixture prerequisites', '```text') + $evidence + @('```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          @("CODEX_TEST_TRUSTED_BASH=$bash", "CODEX_TEST_TRUSTED_JQ=$jq", "CODEX_TEST_TRUSTED_CURL=$curl") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Diagnose Git Bash temporary directory
        shell: pwsh
        run: ./.github/scripts/windows-bash-tmp-diagnostic.ps1

      - name: Record Windows baseline environment
        shell: pwsh
        run: |
          $evidence = @(
            "Checked-out commit: $(git rev-parse HEAD)"
            "Runner image: $env:ImageOS $env:ImageVersion"
            "OS: $([System.Environment]::OSVersion.VersionString)"
            (go version)
            (go env GOOS GOARCH GOPROXY GOSUMDB CGO_ENABLED)
            (git --version)
            (bash --version)
            (node --version)
            ($PSVersionTable | Out-String)
            (Get-Command bash, sh, node, pwsh, git, go | Format-Table Name, Source | Out-String)
          )
          $evidence | Write-Output
          @('## Windows full-suite baseline', '```text') + $evidence + @('```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run complete Go suite
        id: suite
        run: go test ./...

      - name: Record baseline result
        if: always()
        shell: pwsh
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          @(
            'Command: `go test ./...`'
            "Test step outcome: $env:SUITE_OUTCOME"
            "Run and diagnostics: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'The test step log retains stdout, stderr, and the process exit code.'
            'Observational only; failures require classification under issue #1891.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  windows-setup-test:
    name: Windows Setup Test
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run Windows-specific setup test
        run: go test ./internal/setup/ -run 'TestClaudeCodeEngramCommandPreservesWindowsAbsolutePath|TestResolveEngramCommandMiseInstall|TestCanonicalEngramCommand|TestEnsurePiMCPConfigRepairsDeadEngramCommand' -count=1

      - name: Run Windows MCP parent-lifetime tests
        run: go test ./cmd/engram/ -run '^TestMCPJobObject' -count=1

  wrapper-tests-windows:
    name: Cloud Sync Wrapper Tests (Windows)
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
      - run: go test ./tools/ -run '^TestCloudSync(Wrappers|PowerShellMissingEngram)$' -v

  obsidian-build:
    name: Obsidian Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install Obsidian dependencies
        working-directory: plugin/obsidian
        run: npm ci

      - name: Test Obsidian plugin
        working-directory: plugin/obsidian
        run: npm test

      - name: Typecheck Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run typecheck

      - name: Build Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run build

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    # The suite is ~11s of wall time, dominated by one fixture that deliberately
    # exercises the full 10s startup deadline. Ten minutes leaves ample headroom
    # for a cold runner while still catching a genuine hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      # Must match publish-pi.yml: the suite imports index.ts directly and relies
      # on native TypeScript type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      # Real-schema diagnostics need only the locked test dependency, not Pi peers.
      - name: Install Pi test dependencies
        working-directory: plugin/pi
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Set up Go for Pi checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build release candidate checker
        run: go build -mod=readonly -o "$RUNNER_TEMP/engram-release-candidate" ./tools/release-candidate

      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

      # Covers the dual-major (1.x server / 2.x setup) OpenCode adapter.
      - name: Run OpenCode plugin tests
        run: node --test plugin/opencode/engram.test.mjs plugin/opencode/engram.v2.test.mjs plugin/opencode/engram.v2.real-server.test.mjs

  perf-ratchet:
    name: Performance Ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Compare store benchmarks with the previous main revision
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE}" || "${BEFORE}" == "${zero_sha}" ]]; then
            echo '::notice::No previous main revision is available; validating the bootstrap benchmark suite only.'
            PERF_RATCHET_BOOTSTRAP=1 make perf-check
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "::error::Push event before SHA ${BEFORE} is unavailable after checkout." >&2
            exit 1
          fi
          PERF_RATCHET_BOOTSTRAP=1 make perf-check PERF_RATCHET_AGAINST="${BEFORE}"
