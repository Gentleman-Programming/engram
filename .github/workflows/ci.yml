name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run unit tests
        run: go test ./...

      - name: Run binary quick self-test
        run: go build -o engram-selftest ./cmd/engram && ./engram-selftest test --quick

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  windows-setup-test:
    name: Windows Setup Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run Windows-specific setup test
        run: go test ./internal/setup/ -run TestClaudeCodeEngramCommandPreservesWindowsAbsolutePath -count=1

  wrapper-tests-windows:
    name: Cloud Sync Wrapper Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"
      - run: go test ./tools/ -run '^TestCloudSync(Wrappers|PowerShellMissingEngram)$' -v

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    # The suite is ~11s of wall time, dominated by one fixture that deliberately
    # exercises the full 10s startup deadline. Ten minutes leaves ample headroom
    # for a cold runner while still catching a genuine hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Must match publish-pi.yml: the suite imports index.ts directly and relies
      # on native TypeScript type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # No install step: test/plugin-sandbox.mjs copies the plugin into a temp
      # directory with its own stubbed node_modules, so the suite runs from a
      # clean checkout and never writes into plugin/pi/node_modules.
      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

  perf-ratchet:
    name: Performance Ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Compare store benchmarks with the previous main revision
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE}" || "${BEFORE}" == "${zero_sha}" ]]; then
            echo '::notice::No previous main revision is available; validating the bootstrap benchmark suite only.'
            PERF_RATCHET_BOOTSTRAP=1 make perf-check
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "::error::Push event before SHA ${BEFORE} is unavailable after checkout." >&2
            exit 1
          fi
          PERF_RATCHET_BOOTSTRAP=1 make perf-check PERF_RATCHET_AGAINST="${BEFORE}"
