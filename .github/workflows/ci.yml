  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    # The suite is ~11s of wall time, dominated by one fixture that deliberately
    # exercises the full 10s startup deadline. Ten minutes leaves ample headroom
    # for a cold runner while still catching a genuine hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      # Must match publish-pi.yml: the suite imports index.ts directly and relies
      # on native TypeScript type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      # Real-schema diagnostics need only the locked test dependency, not Pi peers.
      - name: Install Pi test dependencies
        working-directory: plugin/pi
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Set up Go for Pi checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build release candidate checker
        run: go build -mod=readonly -o "$RUNNER_TEMP/engram-release-candidate" ./tools/release-candidate

      - name: Verify selected Pi source input projections
        run: ENGRAM_PI_SCHEMA_REQUIRE_REAL=1 go test ./tools/release-candidate -run '^TestPiSourceEvidence$' -count=1 -v

      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

      # Covers the dual-major (1.x server / 2.x setup) OpenCode adapter.
      - name: Run OpenCode plugin tests
        run: node --test plugin/opencode/engram.test.mjs plugin/opencode/engram.v2.test.mjs plugin/opencode/engram.v2.real-server.test.mjs

  perf-ratchet:
    name: Performance Ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Compare store benchmarks with the previous main revision
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE}" || "${BEFORE}" == "${zero_sha}" ]]; then
            echo '::notice::No previous main revision is available; validating the bootstrap benchmark suite only.'
            PERF_RATCHET_BOOTSTRAP=1 make perf-check
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "::error::Push event before SHA ${BEFORE} is unavailable after checkout." >&2
            exit 1
          fi
          PERF_RATCHET_BOOTSTRAP=1 make perf-check PERF_RATCHET_AGAINST="${BEFORE}"
