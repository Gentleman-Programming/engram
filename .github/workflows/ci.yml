name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          only-new-issues: true

  policy-helper-tests:
    name: Policy Helper Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run policy helper tests
        run: node --test .github/scripts/merge-queue.test.mjs .github/scripts/label-policy.test.mjs .github/scripts/transient-artifacts.test.mjs .github/scripts/pr-size-notice.test.mjs

      - name: Run issue policy helper tests
        run: node --test .github/scripts/issue-*.test.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Await selected CI proof
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_PROOF_CONTROL: ${{ vars.ISSUE_CI_PROOF_CI }}
        with:
          script: |
            const raw = process.env.CI_PROOF_CONTROL;
            if (!raw) return;
            const fail = () => new Error('proof-ci: bootstrap');
            let cfg;
            try {
              if (raw.length > 8192) throw fail();
              cfg = JSON.parse(raw);
            } catch { throw fail(); }
            if (cfg?.enabled === false) return;
            if (!['pull_request', 'merge_group'].includes(context.eventName)) return;
            const pr = context.payload.pull_request;
            const mg = context.payload.merge_group;
            const b = { repo: `${context.repo.owner}/${context.repo.repo}`, event: context.eventName,
              action: context.payload.action, job: process.env.GITHUB_JOB, head: context.sha,
              checkout: pr?.base?.sha ?? mg?.base_sha, workflow: process.env.GITHUB_WORKFLOW_SHA,
              runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              prHead: context.eventName === 'pull_request' ? pr?.head?.sha : null };
            if (cfg?.enabled !== true || !cfg.target || typeof cfg.target !== 'object') throw fail();
            const optional = ['runId', 'attempt', 'workflow', 'head'];
            if (Object.keys(b).some((key) => (!optional.includes(key) || key in cfg.target)
              && cfg.target[key] !== b[key])) return;
            const sha = (s) => typeof s === 'string' && /^[a-f0-9]{40}$/.test(s);
            if (![b.head, b.checkout, b.workflow].every(sha)
              || (mg && mg.head_sha !== b.head) || b.job !== 'unit-tests') throw fail();
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'ci-proof-'));
            const pins = {
              'issue-ci-proof-ci.mjs': '02beea7bd200bc213b1e8eb6e65784eaaee4a43cf06f0b4fcee026c2e2c500cb',
              'issue-ci-proof-controls.mjs': '1be88a7a4874f54d0efcfd05a19a812381e216b70c8a0a71f1217579a6a74740',
            };
            try {
              for (const [file, pin] of Object.entries(pins)) {
                const response = await github.rest.repos.getContent({ ...context.repo,
                  path: `.github/scripts/${file}`, ref: b.checkout });
                if (response.data?.encoding !== 'base64' || typeof response.data.content !== 'string') throw fail();
                const bytes = Buffer.from(response.data.content, 'base64');
                if (crypto.createHash('sha256').update(bytes).digest('hex') !== pin) throw fail();
                fs.writeFileSync(path.join(dir, file), bytes, { flag: 'wx' });
              }
              const { holdCI } = require(path.join(dir, 'issue-ci-proof-ci.mjs'));
              await holdCI({ raw, identity: b, github, emit: (r) => core.info(JSON.stringify(r)) });
            } catch { throw fail(); }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Verify generated templ output
        run: |
          make templ
          git diff --exit-code -- 'internal/cloud/dashboard/*_templ.go'
          untracked_templ_outputs=$(git ls-files --others --exclude-standard -- 'internal/cloud/dashboard/*_templ.go')
          if [[ -n "${untracked_templ_outputs}" ]]; then
            echo '::error::Untracked generated templ output detected:' >&2
            printf '%s\n' "${untracked_templ_outputs}" >&2
            exit 1
          fi

      - name: Run dead-code ratchet
        run: make deadcode-check

      - name: Run unit tests
        run: go test ./...

      - name: Run binary quick self-test
        run: go build -o engram-selftest ./cmd/engram && ./engram-selftest test --quick

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  windows-setup-test:
    name: Windows Setup Test
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Run Windows-specific setup test
        run: go test ./internal/setup/ -run 'TestClaudeCodeEngramCommandPreservesWindowsAbsolutePath|TestResolveEngramCommandMiseInstall|TestCanonicalEngramCommand|TestEnsurePiMCPConfigRepairsDeadEngramCommand' -count=1

      - name: Run Windows MCP parent-lifetime tests
        run: go test ./cmd/engram/ -run '^TestMCPJobObject' -count=1

  wrapper-tests-windows:
    name: Cloud Sync Wrapper Tests (Windows)
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
      - run: go test ./tools/ -run '^TestCloudSync(Wrappers|PowerShellMissingEngram)$' -v

  obsidian-build:
    name: Obsidian Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install Obsidian dependencies
        working-directory: plugin/obsidian
        run: npm ci

      - name: Test Obsidian plugin
        working-directory: plugin/obsidian
        run: npm test

      - name: Typecheck Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run typecheck

      - name: Build Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run build

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    # The suite is ~11s of wall time, dominated by one fixture that deliberately
    # exercises the full 10s startup deadline. Ten minutes leaves ample headroom
    # for a cold runner while still catching a genuine hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      # Must match publish-pi.yml: the suite imports index.ts directly and relies
      # on native TypeScript type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      # Real-schema diagnostics need only the locked test dependency, not Pi peers.
      - name: Install Pi test dependencies
        working-directory: plugin/pi
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Set up Go for Pi checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build release candidate checker
        run: go build -mod=readonly -o "$RUNNER_TEMP/engram-release-candidate" ./tools/release-candidate

      - name: Verify selected Pi source input projections
        run: ENGRAM_PI_SCHEMA_REQUIRE_REAL=1 go test ./tools/release-candidate -run '^TestPiSourceEvidence$' -count=1 -v

      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

      # Covers the dual-major (1.x server / 2.x setup) OpenCode adapter.
      - name: Run OpenCode plugin tests
        run: node --test plugin/opencode/engram.test.mjs plugin/opencode/engram.v2.test.mjs plugin/opencode/engram.v2.real-server.test.mjs

  perf-ratchet:
    name: Performance Ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Compare store benchmarks with the previous main revision
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE}" || "${BEFORE}" == "${zero_sha}" ]]; then
            echo '::notice::No previous main revision is available; validating the bootstrap benchmark suite only.'
            PERF_RATCHET_BOOTSTRAP=1 make perf-check
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "::error::Push event before SHA ${BEFORE} is unavailable after checkout." >&2
            exit 1
          fi
          PERF_RATCHET_BOOTSTRAP=1 make perf-check PERF_RATCHET_AGAINST="${BEFORE}"
