name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ci/proof-') && vars.ISSUE_CI_PROOF_CI == '' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ci/proof-') && vars.ISSUE_CI_PROOF_CI == '' }}

permissions:
  contents: read

jobs:
  race-tests:
    name: Go Race Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      CC: gcc
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record tested revision
        run: git rev-parse HEAD

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false

      - name: Verify C compiler prerequisite
        run: gcc --version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Prepare compatible race cache identity
        id: race-cache
        shell: bash
        env:
          CACHE_OS: ${{ runner.os }}
          CACHE_ARCH: ${{ runner.arch }}
          DEPENDENCY_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
          TESTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          scalar() { [[ -n "$1" && "$1" != *$'\r'* && "$1" != *$'\n'* ]]; }
          hash() { sha256sum; }
          image_os="$ImageOS"
          image_version="$ImageVersion"
          for value in "$CACHE_OS" "$CACHE_ARCH" "$image_os" "$image_version" "$DEPENDENCY_HASH" "$TESTED_REVISION" "$CC"; do
            scalar "$value"
          done
          [[ "$DEPENDENCY_HASH" =~ ^[a-f0-9]{64}$ && "$TESTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          revision="$TESTED_REVISION"
          goversion=$(go env GOVERSION)
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          cgo=$(go env CGO_ENABLED)
          [[ "$goversion" == go1.26.10 && "$cgo" == 1 && "$goos" == linux && "$goarch" == amd64 ]]
          compiler=$(readlink -f "$(command -v "$CC")")
          [[ "$compiler" == /* && -x "$compiler" ]]
          compiler_sha=$(hash < "$compiler")
          compiler_sha=${compiler_sha%% *}
          compiler_version=$("$compiler" -dumpfullversion)
          compiler_target=$("$compiler" -dumpmachine)
          compiler_descriptor=$("$compiler" --version)
          # Full version text may be multiline; hash it, never emit it as an output.
          [[ -n "$compiler_descriptor" ]]
          compiler_descriptor_hash=$(printf '%s' "$compiler_descriptor" | hash)
          compiler_descriptor_hash=${compiler_descriptor_hash%% *}
          gomodcache=$(go env GOMODCACHE)
          gocache=$(go env GOCACHE)
          for value in "$goversion" "$goos" "$goarch" "$cgo" "$compiler" "$compiler_sha" "$compiler_version" "$compiler_target" "$compiler_descriptor_hash" "$gomodcache" "$gocache"; do
            scalar "$value"
          done
          [[ "$gomodcache" == /* && "$gocache" == /* ]]
          [[ "$compiler_sha" =~ ^[a-f0-9]{64}$ && "$compiler_descriptor_hash" =~ ^[a-f0-9]{64}$ ]]
          printf 'Resolved race compiler: %s\nSHA256: %s\nFull version: %s\nTarget: %s\n%s\n' "$compiler" "$compiler_sha" "$compiler_version" "$compiler_target" "$compiler_descriptor"
          compat=$(printf '%s\0' "$CACHE_OS" "$CACHE_ARCH" "$image_os" "$image_version" "$goversion" "$goos" "$goarch" "$DEPENDENCY_HASH" "$cgo" "$CC" "$compiler" "$compiler_sha" "$compiler_version" "$compiler_target" "$compiler_descriptor_hash" race | hash)
          compat=${compat%% *}
          prefix="race-v1-${compat}-"
          key="${prefix}${revision}"
          [[ ${#key} -lt 512 ]]
          printf 'gomodcache=%s\n' "$gomodcache" >> "$GITHUB_OUTPUT"
          printf 'gocache=%s\n' "$gocache" >> "$GITHUB_OUTPUT"
          printf 'prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore compatible race caches
        id: race-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.race-cache.outputs.gomodcache }}
            ${{ steps.race-cache.outputs.gocache }}
          key: ${{ steps.race-cache.outputs.key }}
          restore-keys: ${{ steps.race-cache.outputs.prefix }}

      - name: Run full race suite with elapsed time
        run: /usr/bin/time -p go test -race -timeout=20m ./...

      - name: Refresh successful trusted main race caches
        if: ${{ success() && github.repository == 'Gentleman-Programming/engram' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.race-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.race-cache.outputs.gomodcache }}
            ${{ steps.race-cache.outputs.gocache }}
          key: ${{ steps.race-cache.outputs.key }}

  macos-native-tests:
    name: Native macOS ARM64 Tests
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Verify native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          uname -sm
          sw_vers
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          go version
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED
          node --version
          test "$(uname -sm)" = "Darwin arm64"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
          test "$(node -p 'process.platform + "/" + process.arch')" = darwin/arm64
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          for tool in bash git jq curl cat date dirname touch mktemp sh make; do command -v "$tool"; done
          /bin/bash --version
          git --version
          jq --version
          curl --version
          # The existing compatibility fixture consumes this absolute path, not PATH jq.
          test -x /usr/bin/jq || { echo "::error::Incomplete native coverage: /usr/bin/jq fixture prerequisite absent"; exit 1; }
          /usr/bin/jq --version

      - name: Isolate test state
        shell: bash
        run: |
          set -euo pipefail
          # Short, private socket paths; never a user home or store. The VM owns this root.
          state=$(mktemp -d /tmp/eg-mac.XXXXXX)
          state=$(cd "$state" && pwd -P)
          printf 'Physical test root=%s\n' "$state"
          mkdir -p "$state/home" "$state/tmp" "$state/store"
          ln -s "$state/home" "$state/link"
          test -d "$state/link"
          rm "$state/link"
          {
            echo "HOME=$state/home"
            echo "TMPDIR=$state/tmp"
            echo "TMP=$state/tmp"
            echo "TEMP=$state/tmp"
            echo "ENGRAM_DATA_DIR=$state/store"
            echo "GOMODCACHE=$(go env GOMODCACHE)"
            echo "GOCACHE=$(go env GOCACHE)"
          } >> "$GITHUB_ENV"

      - name: Run native Go suite
        id: native-tests
        shell: bash
        run: |
          set -euo pipefail
          # Tests may supply their own overrides; do not inherit live host configuration.
          while IFS='=' read -r key _; do
            case "$key" in ENGRAM_*|GENTLE_*|CLOUDSTORE_TEST_DSN|NODE_OPTIONS|GOFLAGS) unset "$key" ;; esac
          done < <(env)
          export ENGRAM_DATA_DIR="$HOME/../store"
          /usr/bin/time -p go test -json -count=1 -timeout=10m ./... | tee "$RUNNER_TEMP/macos-native-tests.json"

      - name: Summarize native scope
        if: ${{ !cancelled() }}
        env:
          NATIVE_TEST_OUTCOME: ${{ steps.native-tests.outcome }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = { scope: 'Darwin ARM64 default-tag source suite', tests: { pass: 0, fail: 0, skip: 0 },
            packages: { pass: 0, fail: 0, skip: 0 }, skips: [], buildFailures: [], unfinished: [], coverage: 'incomplete' };
          try {
            const outputs = new Map(), active = new Set();
            const foreign = ['Windows-only path case normalization', 'requires native Windows paths',
              'Windows handle inheritance regression', 'Windows in-process startup isolation', 'Windows process bootstrap',
              'Windows process routing', 'Windows startup failures', 'native Windows SQLite temporary routing',
              'PowerShell wrapper test is Windows-only', 'Git for Windows discovery',
              'requires native Windows cmd.exe and PowerShell', 'requires Windows PowerShell', 'requires PowerShell',
              'requires Windows external commands', 'requires native Windows and Git Bash',
              'Unix socket hook transport requires a Linux test process'];
            const capability = ['fixture filesystem does not expose a case alias', 'case spelling identifies a distinct directory',
              'temp filesystem is case-sensitive; case-only aliases are distinct',
              'filesystem cannot represent case-distinct candidate paths',
              'filesystem exposes a case alias instead of distinct case directories'];
            for (const line of fs.readFileSync(process.env.RUNNER_TEMP + '/macos-native-tests.json', 'utf8').split('\n').filter(Boolean)) {
              const e = JSON.parse(line), key = e.Package + '/' + e.Test;
              if (e.Action === 'start') active.add(e.Package);
              if (e.Action === 'build-fail') report.buildFailures.push(e.ImportPath);
              if (e.Action === 'output') outputs.set(key, (outputs.get(key) ?? '') + e.Output);
              if (!['pass', 'fail', 'skip'].includes(e.Action)) continue;
              if (!e.Test) active.delete(e.Package);
              report[e.Test ? 'tests' : 'packages'][e.Action]++;
              if (e.Action !== 'skip') continue;
              const reason = outputs.get(key) ?? '';
              let classification = 'incomplete';
              if (!e.Test && reason.includes('[no test files]')) classification = 'no-test-files';
              else if (foreign.some(x => reason.includes(x))) classification = 'foreign-os';
              else if (capability.some(x => reason.includes(x))) classification = 'filesystem-capability';
              else if (['CLOUDSTORE_TEST_DSN not set', 'requires URL-style CLOUDSTORE_TEST_DSN and disposable PostgreSQL',
                'requires disposable PostgreSQL via CLOUDSTORE_TEST_DSN',
                'set ENGRAM_DASHBOARD_BENCH_DSN to the documented owned fixture',
                'set ENGRAM_PAUSE_BENCH_DSN to the owned measurement fixture'].some(x => reason.includes(x))) classification = 'excluded-postgres';
              else if (reason.includes('unsupported-runtime regression requires Node.js <24')) classification = 'foreign-runtime';
              else if (reason.includes('TUI has no entry serialization')) classification = 'no-serialization';
              else if (/runs only as a child of Test(StoreContentionAcrossProcesses|ConcurrentColdStartProcesses)/.test(reason)) classification = 'child-helper';
              else if ((e.Package.endsWith('/internal/mcp') && e.Test === 'TestPiInputRealCapture' && reason.includes('Pi schema prerequisites absent: TypeBox'))
                || (e.Package.endsWith('/tools/release-candidate') && reason.includes('real capture requires fixed local TypeBox1.3.34 and Node24;'))) classification = 'optional-pi-capture';
              report.skips.push({ package: e.Package, test: e.Test ?? null, classification, reason });
            }
            report.unfinished = [...active];
            if (process.env.NATIVE_TEST_OUTCOME === 'success'
              && report.tests.pass > 0 && report.packages.pass > 0 && !report.tests.fail && !report.packages.fail
              && !report.buildFailures.length && !report.unfinished.length
              && report.skips.every(s => s.classification !== 'incomplete')) report.coverage = 'complete-with-listed-exclusions';
          } catch (error) { report.error = error.message; }
          const json = JSON.stringify(report);
          console.log(json);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Native macOS scope\n\n```json\n' + json.replaceAll('`', '\\u0060') + '\n```\n');
          if (report.coverage === 'incomplete') process.exitCode = 1;
          NODE

  macos-adapter-tests:
    name: Native macOS ARM64 Adapter Tests
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Verify adapter prerequisites and isolate state
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          uname -sm
          sw_vers
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          go version
          node --version
          npm --version
          test "$(uname -sm)" = "Darwin arm64"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64
          test "$(node -p 'process.platform + "/" + process.arch')" = darwin/arm64
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          for file in docs/contracts/agent-contract-v1.json plugin/pi/test/support/real-server/main.go plugin/opencode/test/support/real-server/main.go; do test -f "$file"; done
          state=$(mktemp -d /tmp/eg-adapter.XXXXXX)
          state=$(cd "$state" && pwd -P)
          printf 'Physical adapter root=%s\n' "$state"
          mkdir -p "$state/home" "$state/tmp" "$state/store"
          {
            echo "HOME=$state/home"
            echo "TMPDIR=$state/tmp"
            echo "TMP=$state/tmp"
            echo "TEMP=$state/tmp"
            echo "GOMODCACHE=$(go env GOMODCACHE)"
            echo "GOCACHE=$(go env GOCACHE)"
          } >> "$GITHUB_ENV"
      - name: Install locked Pi test dependency
        working-directory: plugin/pi
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Prepare repository Go dependencies
        run: go mod download
      - name: Build existing Pi fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p = require("./plugin/pi/node_modules/typebox/package.json"); if (p.name !== "typebox" || p.version !== "1.3.34") process.exit(1)'
          go build -mod=readonly -o "$RUNNER_TEMP/pi-test-server" ./plugin/pi/test/support/real-server
          echo "ENGRAM_PI_TEST_SERVER_BINARY=$RUNNER_TEMP/pi-test-server" >> "$GITHUB_ENV"
      - name: Run Pi adapters
        id: pi
        timeout-minutes: 5
        working-directory: plugin/pi
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r key _; do
            case "$key" in ENGRAM_*|GENTLE_*|CLOUDSTORE_TEST_DSN|NODE_OPTIONS|GOFLAGS) unset "$key" ;; esac
          done < <(env)
          export ENGRAM_DATA_DIR="$HOME/../store" ENGRAM_PI_TEST_SERVER_BINARY="$RUNNER_TEMP/pi-test-server"
          node --test --test-reporter=tap --test-concurrency=1 test/*.test.mjs | tee "$RUNNER_TEMP/pi.tap"
      - name: Run OpenCode adapters
        id: opencode
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r key _; do
            case "$key" in ENGRAM_*|GENTLE_*|CLOUDSTORE_TEST_DSN|NODE_OPTIONS|GOFLAGS) unset "$key" ;; esac
          done < <(env)
          export ENGRAM_DATA_DIR="$HOME/../store"
          node --test --test-reporter=tap plugin/opencode/engram.test.mjs plugin/opencode/engram.v2.test.mjs plugin/opencode/engram.v2.real-server.test.mjs | tee "$RUNNER_TEMP/opencode.tap"
      - name: Summarize adapter execution
        if: ${{ !cancelled() }}
        env:
          PI_OUTCOME: ${{ steps.pi.outcome }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = { scope: 'Darwin ARM64 Pi/OpenCode source adapters', suites: {}, coverage: 'incomplete' };
          const required = {
            pi: ['Pi native saves persist under separate host sessions and stop on failed registration',
              'existing CLI verifies real Pi registration without writing',
              'packaged real workflows run all eight tests with the prebuilt fixture binary'],
            opencode: ['V2 inbox prompts stay idempotent and deleted across real server restarts'],
          };
          for (const [suite, names] of Object.entries(required)) {
            const result = report.suites[suite] = { outcome: process.env[suite.toUpperCase() + '_OUTCOME'], counts: {}, skips: [], complete: false };
            try {
              const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/' + suite + '.tap', 'utf8');
              const lines = raw.trimEnd().split(/\r?\n/), seen = new Set();
              let header = 0, plan, number = 0, records = 0;
              for (const line of lines) {
                if (line === 'TAP version 13') header++;
                const record = line.match(/^\s*(ok|not ok) \d+ - /);
                if (record) {
                  records++;
                  if (record[1] !== 'ok') throw Error('failed test record');
                }
                const entry = line.match(/^(ok|not ok) (\d+) - (.*?)(?: # SKIP (.*))?$/);
                if (entry) {
                  if (!header || entry[1] !== 'ok' || Number(entry[2]) !== ++number) throw Error('invalid top-level result');
                  seen.add(entry[3]);
                  if (entry[4] !== undefined) result.skips.push({ name: entry[3], reason: entry[4] });
                }
                if (/^1\.\./.test(line)) {
                  if (plan !== undefined || !/^1\.\.\d+$/.test(line)) throw Error('invalid plan');
                  plan = Number(line.slice(3));
                }
                const count = line.match(/^# (tests|suites|pass|fail|cancelled|skipped|todo) (\d+)$/);
                if (count) {
                  if (Object.hasOwn(result.counts, count[1])) throw Error('duplicate counter');
                  result.counts[count[1]] = Number(count[2]);
                }
              }
              const c = result.counts;
              if (header !== 1 || !number || plan !== number || Object.keys(c).length !== 7
                || !/^# duration_ms \d+(\.\d+)?$/.test(lines.at(-1))
                || c.tests !== records || c.tests !== c.pass + c.fail + c.cancelled + c.skipped + c.todo
                || !c.pass || c.suites || c.fail || c.cancelled || c.todo || c.skipped !== result.skips.length
                || !names.every(name => seen.has(name))) throw Error('incomplete test execution');
              if (!result.skips.every(s => suite === 'pi'
                && s.name === 'actual Pi hosts retain attribution through compaction, resume and refusal'
                && s.reason === 'opt-in: set ENGRAM_PI_LIFECYCLE_CLI to the installed Pi CLI entry point')) throw Error('unexpected skip');
              result.complete = result.outcome === 'success';
            } catch (error) { result.error = error.message; }
          }
          if (Object.values(report.suites).every(s => s.complete)) report.coverage = 'complete-with-listed-exclusions';
          const json = JSON.stringify(report);
          console.log(json);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Native macOS adapters\n\n```json\n' + json.replaceAll('`', '\\u0060') + '\n```\n');
          if (report.coverage === 'incomplete') process.exitCode = 1;
          NODE

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/ci-scanners
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Linux production packages
        shell: bash
        run: bash .github/scripts/ci-scanner.sh govulncheck "$RUNNER_TEMP/ci-scanners/govulncheck" -format=text -scan=symbol ./...

  actionlint:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned validator
        env:
          GOBIN: ${{ runner.temp }}/ci-scanners
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate all workflow YAML
        shell: bash
        run: |
          shopt -s nullglob
          bash .github/scripts/ci-scanner.sh actionlint "$RUNNER_TEMP/ci-scanners/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml .github/workflows/*.yaml

  claude-jq16-compatibility:
    name: Claude jq 1.6 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Verify pinned jq 1.6
        shell: bash
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/engram-jq16"
          mkdir -p "$bindir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 60 \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64 -o "$bindir/jq"
          printf '%s  %s\n' af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44 "$bindir/jq" | sha256sum -c -
          chmod +x "$bindir/jq"
          version=$("$bindir/jq" --version)
          test "$version" = jq-1.6
          printf '%s\n' "$version"
          printf 'ENGRAM_TEST_JQ16=%s\n' "$bindir/jq" >> "$GITHUB_ENV"
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"

      - name: Run focused Claude response compatibility tests
        run: go test ./plugin -run '^(TestClaudeHookResponseValidation|TestClaudeJQ16SelectorRejectsWrongVersion)$' -count=1 -v -timeout=120s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
