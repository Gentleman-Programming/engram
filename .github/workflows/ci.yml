name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ci/proof-') && vars.ISSUE_CI_PROOF_CI == '' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ci/proof-') && vars.ISSUE_CI_PROOF_CI == '' }}

permissions:
  contents: read

jobs:
  race-tests:
    name: Go Race Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      CC: gcc
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record tested revision
        run: git rev-parse HEAD

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Verify C compiler prerequisite
        run: gcc --version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run full race suite with elapsed time
        run: /usr/bin/time -p go test -race -timeout=20m ./...

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/ci-scanners
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Linux production packages
        shell: bash
        run: bash .github/scripts/ci-scanner.sh govulncheck "$RUNNER_TEMP/ci-scanners/govulncheck" -format=text -scan=symbol ./...

  actionlint:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned validator
        env:
          GOBIN: ${{ runner.temp }}/ci-scanners
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate all workflow YAML
        shell: bash
        run: |
          shopt -s nullglob
          bash .github/scripts/ci-scanner.sh actionlint "$RUNNER_TEMP/ci-scanners/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml .github/workflows/*.yaml

  claude-jq16-compatibility:
    name: Claude jq 1.6 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Verify pinned jq 1.6
        shell: bash
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/engram-jq16"
          mkdir -p "$bindir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 60 \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64 -o "$bindir/jq"
          printf '%s  %s\n' af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44 "$bindir/jq" | sha256sum -c -
          chmod +x "$bindir/jq"
          version=$("$bindir/jq" --version)
          test "$version" = jq-1.6
          printf '%s\n' "$version"
          printf 'ENGRAM_TEST_JQ16=%s\n' "$bindir/jq" >> "$GITHUB_ENV"
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"

      - name: Run focused Claude response compatibility tests
        run: go test ./plugin -run '^(TestClaudeHookResponseValidation|TestClaudeJQ16SelectorRejectsWrongVersion)$' -count=1 -v -timeout=120s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          only-new-issues: true

  policy-helper-tests:
    name: Policy Helper Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run policy helper tests
        run: node --test .github/scripts/merge-queue.test.mjs .github/scripts/label-policy.test.mjs .github/scripts/transient-artifacts.test.mjs .github/scripts/pr-size-notice.test.mjs .github/scripts/ci-unit-node.test.mjs

      - name: Run PostgreSQL CI policy tests
        run: node --test .github/scripts/postgres-ci.test.mjs

      - name: Run scanner policy tests
        run: node --test .github/scripts/ci-scanners.test.mjs

      - name: Run technical CI contract tests
        run: node --test .github/scripts/ci-technical-contracts.test.mjs

      - name: Run issue policy helper tests
        run: node --test .github/scripts/issue-*.test.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Await selected CI proof
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_PROOF_CONTROL: ${{ vars.ISSUE_CI_PROOF_CI }}
        with:
          script: |
            let raw = process.env.CI_PROOF_CONTROL;
            const ref = process.env.GITHUB_HEAD_REF ?? '';
            const proofBranch = context.eventName === 'pull_request' && ref.startsWith('ci/proof-');
            if (!raw && !proofBranch) return;
            const fail = () => new Error('proof-ci: bootstrap');
            let cfg;
            if (!proofBranch) {
              try {
                if (raw.length > 8192) throw fail();
                cfg = JSON.parse(raw);
              } catch { throw fail(); }
              if (cfg?.enabled === false) return;
            }
            if (!['pull_request', 'merge_group'].includes(context.eventName)) return;
            const pr = context.payload.pull_request;
            const mg = context.payload.merge_group;
            const b = { repo: `${context.repo.owner}/${context.repo.repo}`, event: context.eventName,
              action: context.payload.action, job: process.env.GITHUB_JOB, head: context.sha,
              checkout: pr?.base?.sha ?? mg?.base_sha, workflow: process.env.GITHUB_WORKFLOW_SHA,
              runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              prHead: context.eventName === 'pull_request' ? pr?.head?.sha : null };
            let route;
            if (proofBranch) {
              route = /^ci\/proof-([1-9]\d*)-([a-z0-9][a-z0-9._-]{0,99})$/.exec(ref);
              const positive = (n) => Number.isSafeInteger(n) && n > 0;
              if (raw || !route || !positive(Number(route[1])) || Number(route[1]) > 2147483647
                || b.repo !== 'Gentleman-Programming/engram' || pr?.base?.ref !== 'main'
                || pr?.base?.repo?.full_name !== b.repo || !positive(pr?.number)
                || typeof pr?.head?.repo?.full_name !== 'string'
                || !/^[\w.-]+\/[\w.-]+$/.test(pr.head.repo.full_name)
                || pr.head.repo.full_name.toLowerCase() === b.repo.toLowerCase()
                || !positive(b.runId) || !positive(b.attempt)
                || typeof b.action !== 'string' || !/^[\w-]+$/.test(b.action)) throw fail();
            } else {
              if (cfg?.enabled !== true || !cfg.target || typeof cfg.target !== 'object') throw fail();
              const optional = ['runId', 'attempt', 'workflow', 'head'];
              if (Object.keys(b).some((key) => (!optional.includes(key) || key in cfg.target)
                && cfg.target[key] !== b[key])) return;
            }
            const sha = (s) => typeof s === 'string' && /^[a-f0-9]{40}$/.test(s);
            if (![b.head, b.checkout, b.workflow].every(sha)
              || (mg && mg.head_sha !== b.head) || b.job !== 'unit-tests'
              || (proofBranch && !sha(b.prHead))) throw fail();
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'ci-proof-'));
            const deadline = proofBranch ? Date.now() + 15000 : 0;
            let last = deadline - 15000;
            const remaining = () => {
              if (!proofBranch) return;
              const n = Date.now();
              if (!Number.isSafeInteger(n) || n < last || n >= deadline) throw fail();
              last = n;
              return deadline - n;
            };
            const getSource = async (request) => {
              if (!proofBranch) return github.rest.repos.getContent(request);
              const ms = remaining(), abort = new AbortController();
              let timer;
              try {
                const response = await Promise.race([
                  github.rest.repos.getContent({ ...request, request: { timeout: ms, signal: abort.signal } }),
                  new Promise((_, reject) => { timer = setTimeout(() => { abort.abort(); reject(fail()); }, ms); }),
                ]);
                remaining();
                return response;
              } finally { clearTimeout(timer); }
            };
            const pins = {
              'issue-ci-proof-ci.mjs': '02beea7bd200bc213b1e8eb6e65784eaaee4a43cf06f0b4fcee026c2e2c500cb',
              'issue-ci-proof-controls.mjs': '1be88a7a4874f54d0efcfd05a19a812381e216b70c8a0a71f1217579a6a74740',
            };
            if (proofBranch) pins['issue-ci-proof-config.mjs'] = '72673c0722df90e7229f5cc5f2d2e217600e6a83f58686eba7d178da357cc95c';
            try {
              for (const [file, pin] of Object.entries(pins)) {
                const response = await getSource({ ...context.repo,
                  path: `.github/scripts/${file}`, ref: b.checkout });
                if (response.data?.encoding !== 'base64' || typeof response.data.content !== 'string') throw fail();
                const bytes = Buffer.from(response.data.content, 'base64');
                if (crypto.createHash('sha256').update(bytes).digest('hex') !== pin) throw fail();
                fs.writeFileSync(path.join(dir, file), bytes, { flag: 'wx' });
              }
              if (proofBranch) {
                const { readCIConfiguration } = require(path.join(dir, 'issue-ci-proof-config.mjs'));
                const selected = await readCIConfiguration({ github, identity: b, prNumber: pr.number,
                  issueNumber: Number(route[1]), caseName: route[2], deadline, now: Date.now });
                remaining();
                raw = selected.raw;
                core.info(JSON.stringify(selected.receipt));
              }
              const { holdCI } = require(path.join(dir, 'issue-ci-proof-ci.mjs'));
              await holdCI({ raw, identity: b, github, emit: (r) => core.info(JSON.stringify(r)) });
            } catch { throw fail(); }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Verify module metadata is tidy
        run: go mod tidy -diff

      - name: Verify generated templ output
        run: |
          make templ
          git diff --exit-code -- 'internal/cloud/dashboard/*_templ.go'
          untracked_templ_outputs=$(git ls-files --others --exclude-standard -- 'internal/cloud/dashboard/*_templ.go')
          if [[ -n "${untracked_templ_outputs}" ]]; then
            echo '::error::Untracked generated templ output detected:' >&2
            printf '%s\n' "${untracked_templ_outputs}" >&2
            exit 1
          fi

      - name: Run dead-code ratchet
        run: make deadcode-check

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Run unit tests
        run: go test ./...

      - name: Run binary quick self-test
        run: go build -o engram-selftest ./cmd/engram && ./engram-selftest test --quick

  postgres-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engram_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: engram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram_test -d engram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLOUDSTORE_TEST_DSN: postgres://engram_test:disposable_test_password@127.0.0.1:5432/engram_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Record revision and verify database connection
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go version
          node --version
          psql "$CLOUDSTORE_TEST_DSN" -v ON_ERROR_STOP=1 -c 'SELECT version();'

      - name: Run PostgreSQL integration suites and verify execution
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=10m ./internal/cloud/cloudstore ./internal/cloud/cloudserver ./cmd/engram | tee "$RUNNER_TEMP/postgres-tests.json"
          node .github/scripts/postgres-ci-evidence.mjs "$RUNNER_TEMP/postgres-tests.json"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  windows-setup-test:
    name: Windows Setup Test
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Run Windows-specific setup test
        run: go test ./internal/setup/ -run 'TestClaudeCodeEngramCommandPreservesWindowsAbsolutePath|TestResolveEngramCommandMiseInstall|TestCanonicalEngramCommand|TestEnsurePiMCPConfigRepairsDeadEngramCommand' -count=1

      - name: Run Windows MCP parent-lifetime tests
        run: go test ./cmd/engram/ -run '^TestMCPJobObject' -count=1

  wrapper-tests-windows:
    name: Cloud Sync Wrapper Tests (Windows)
    runs-on: windows-latest
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
      - run: go test ./tools/ -run '^TestCloudSync(Wrappers|PowerShellMissingEngram)$' -v

  obsidian-build:
    name: Obsidian Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install Obsidian dependencies
        working-directory: plugin/obsidian
        run: npm ci

      - name: Test Obsidian plugin
        working-directory: plugin/obsidian
        run: npm test

      - name: Typecheck Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run typecheck

      - name: Build Obsidian plugin
        working-directory: plugin/obsidian
        run: npm run build

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    # The suite is ~11s of wall time, dominated by one fixture that deliberately
    # exercises the full 10s startup deadline. Ten minutes leaves ample headroom
    # for a cold runner while still catching a genuine hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      # Must match publish-pi.yml: the suite imports index.ts directly and relies
      # on native TypeScript type stripping.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      # Real-schema diagnostics need only the locked test dependency, not Pi peers.
      - name: Install Pi test dependencies
        working-directory: plugin/pi
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Set up Go for Pi checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build release candidate checker
        run: go build -mod=readonly -o "$RUNNER_TEMP/engram-release-candidate" ./tools/release-candidate

      - name: Verify selected Pi source input projections
        run: ENGRAM_PI_SCHEMA_REQUIRE_REAL=1 go test ./tools/release-candidate -run '^TestPiSourceEvidence$' -count=1 -v

      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

      # Covers the dual-major (1.x server / 2.x setup) OpenCode adapter.
      - name: Run OpenCode plugin tests
        run: node --test plugin/opencode/engram.test.mjs plugin/opencode/engram.v2.test.mjs plugin/opencode/engram.v2.real-server.test.mjs

  perf-ratchet:
    name: Performance Ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"

      - name: Compare store benchmarks with the previous main revision
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE}" || "${BEFORE}" == "${zero_sha}" ]]; then
            echo '::notice::No previous main revision is available; validating the bootstrap benchmark suite only.'
            PERF_RATCHET_BOOTSTRAP=1 make perf-check
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "::error::Push event before SHA ${BEFORE} is unavailable after checkout." >&2
            exit 1
          fi
          PERF_RATCHET_BOOTSTRAP=1 make perf-check PERF_RATCHET_AGAINST="${BEFORE}"
