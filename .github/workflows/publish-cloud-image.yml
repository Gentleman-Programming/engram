name: publish-cloud-image

on:
  push:
    branches: [custom/main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/horacioespinosa/engram:custom
            ghcr.io/horacioespinosa/engram:custom-${{ github.sha }}
