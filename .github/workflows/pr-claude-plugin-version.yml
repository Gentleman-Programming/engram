name: PR Claude Plugin Version

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-claude-plugin-version:
    name: Check Claude Plugin Version
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify synchronized plugin version advancement
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          policy=.github/scripts/claude-plugin-version.mjs
          # Bootstrap only while the trusted base has not yet acquired the policy.
          if [[ -n "$(git ls-tree --name-only "$BASE_SHA" -- "$policy")" ]]; then
            git show "$BASE_SHA:$policy" > "$policy"
          else
            echo 'Trusted base has no Claude plugin version policy; using candidate bootstrap policy.'
            test -f "$policy"
          fi
          node "$policy" "$BASE_SHA" "$HEAD_SHA"
      - name: Test Claude plugin version guard
        run: node --test .github/scripts/claude-plugin-version.test.mjs
