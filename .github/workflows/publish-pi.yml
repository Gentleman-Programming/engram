name: Publish gentle-engram

on:
  push:
    tags:
      - "pi-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          CURRENT=$(npm --version)
          echo "Bundled npm: $CURRENT"
          if [ "$(printf '%s\n11.5.1\n' "$CURRENT" | sort -V | head -1)" != "11.5.1" ]; then
            echo "Upgrading to npm@11.5.1 for OIDC support..."
            npm install -g npm@11.5.1
          fi
          echo "Active npm: $(npm --version)"

      - name: Verify Pi release version
        working-directory: plugin/pi
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node test/release-contract.mjs "$RELEASE_REF"

      - name: Set up Go for Pi checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build release candidate checker
        run: go build -mod=readonly -o "$RUNNER_TEMP/engram-release-candidate" ./tools/release-candidate

      - name: Run Pi plugin tests
        working-directory: plugin/pi
        run: npm test

      - name: Publish to npm with provenance
        working-directory: plugin/pi
        run: npm publish --provenance --access public
