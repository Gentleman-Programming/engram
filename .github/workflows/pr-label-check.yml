name: PR Label Policy

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-label-policy:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-type-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Read current pull request labels
        id: current-labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            return pull.data.labels.map((label) => label.name);
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate canonical PR labels
        env:
          PR_LABELS: ${{ steps.current-labels.outputs.result }}
        run: >-
          node .github/scripts/label-policy.mjs --target pull-request
          --labels-json "$PR_LABELS"
