name: PR Label Bootstrap

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-type-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Validate required type label from the trusted event payload
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const typeLabels = labels.filter((label) => label.startsWith('type:'));

            if (typeLabels.length !== 1) {
              core.setFailed(
                `PR requires exactly one type:* label; found ${typeLabels.length}: ` +
                `${typeLabels.join(', ') || '(none)'}`
              );
              return;
            }

            core.info(`PR has type label: ${typeLabels[0]}`);
