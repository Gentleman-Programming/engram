name: PR Validation

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify PR links an issue
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const validate = (pull) => {
              const matches = [...(pull.body || '').matchAll(issuePattern)];
              if (matches.length === 0) return ['no closing issue reference found'];
              core.info(`✅ PR #${pull.number} references issue(s): #${matches.map((match) => match[1]).join(', ')}`);
              return [];
            };
            let failures;
            if (context.eventName === 'merge_group') {
              const { aggregatePullRequestResults, resolveAssociatedPullRequests } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/merge-queue.mjs`);
              try {
                const pulls = await resolveAssociatedPullRequests(github, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  baseRef: context.payload.merge_group.base_ref,
                  headRef: context.payload.merge_group.head_ref,
                });
                failures = await aggregatePullRequestResults(pulls, validate);
              } catch (err) { core.setFailed(`❌ Could not fetch queued pull requests: ${err.message}`); return; }
            } else {
              const pull = context.payload.pull_request;
              failures = validate(pull).map((error) => `PR #${pull.number}: ${error}`);
            }

            if (failures.length > 0) {
              core.setFailed(
                '❌ PR must reference an approved issue.\n' +
                'Add "Closes #N", "Fixes #N", or "Resolves #N" to every PR body.\n' +
                failures.join('\n')
              );
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify linked issue is approved
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const validate = async (pull) => {
              const matches = [...(pull.body || '').matchAll(issuePattern)];
              if (matches.length === 0) return ['no closing issue reference found'];

              const errors = [];
              for (const match of matches) {
                const issueNumber = parseInt(match[1], 10);
                core.info(`Checking PR #${pull.number} issue #${issueNumber} for status:approved label...`);
                try {
                  const issue = (await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                  })).data;
                  const labels = issue.labels.map((label) => label.name);
                  if (!labels.includes('status:approved')) {
                    errors.push(`issue #${issueNumber} ("${issue.title}") does not have the \`status:approved\` label.`);
                  } else {
                    core.info(`✅ PR #${pull.number} issue #${issueNumber} has status:approved`);
                  }
                } catch (err) {
                  errors.push(`issue #${issueNumber}: could not be fetched (${err.message})`);
                }
              }
              return errors;
            };
            let failures;
            if (context.eventName === 'merge_group') {
              const { aggregatePullRequestResults, resolveAssociatedPullRequests } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/merge-queue.mjs`);
              try {
                const pulls = await resolveAssociatedPullRequests(github, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  baseRef: context.payload.merge_group.base_ref,
                  headRef: context.payload.merge_group.head_ref,
                });
                failures = await aggregatePullRequestResults(pulls, validate);
              } catch (err) { core.setFailed(`❌ Could not fetch queued pull requests: ${err.message}`); return; }
            } else {
              const pull = context.payload.pull_request;
              failures = (await validate(pull)).map((error) => `PR #${pull.number}: ${error}`);
            }

            if (failures.length > 0) {
              core.setFailed('❌ Linked issue(s) not approved:\n' + failures.join('\n'));
            }
