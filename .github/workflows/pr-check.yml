name: PR Validation

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-claude-plugin-version:
    name: Check Claude Plugin Version
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify synchronized plugin version advancement
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          policy=.github/scripts/claude-plugin-version.mjs
          # Bootstrap only while the trusted base has not yet acquired the policy.
          if [[ -n "$(git ls-tree --name-only "$BASE_SHA" -- "$policy")" ]]; then
            git show "$BASE_SHA:$policy" > "$policy"
          else
            echo 'Trusted base has no Claude plugin version policy; using candidate bootstrap policy.'
            test -f "$policy"
          fi
          node "$policy" "$BASE_SHA" "$HEAD_SHA"
      - name: Test Claude plugin version guard
        run: node --test .github/scripts/claude-plugin-version.test.mjs

  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify PR links an issue
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issuePattern = /(?:closes|fixes|resolves|refs)\s+(?:([a-z0-9_.-]+)\/([a-z0-9_.-]+))?#(\d+)/gi;
            const validate = (pull) => {
              const matches = [...(pull.body || '').matchAll(issuePattern)];
              if (matches.length === 0) return ['no issue reference found'];

              const trustedOwner = context.repo.owner.toLowerCase();
              const errors = [];
              const validRefs = [];

              for (const match of matches) {
                const owner = (match[1] || context.repo.owner).toLowerCase();
                const rawRef = match[1] && match[2] ? `${match[1]}/${match[2]}#${match[3]}` : `#${match[3]}`;

                if (owner !== trustedOwner) {
                  errors.push(`unauthorized issue reference "${rawRef}": issues must belong to ${context.repo.owner}`);
                  continue;
                }
                validRefs.push(rawRef);
              }

              if (errors.length > 0) return errors;
              if (validRefs.length === 0) return ['no valid trusted issue reference found'];

              core.info(`✅ PR #${pull.number} references issue(s): ${validRefs.join(', ')}`);
              return [];
            };
            let failures;
            if (context.eventName === 'merge_group') {
              const { aggregatePullRequestResults, resolveAssociatedPullRequests } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/merge-queue.mjs`);
              try {
                const pulls = await resolveAssociatedPullRequests(github, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  baseRef: context.payload.merge_group.base_ref,
                  headRef: context.payload.merge_group.head_ref,
                });
                failures = await aggregatePullRequestResults(pulls, validate);
              } catch (err) { core.setFailed(`❌ Could not fetch queued pull requests: ${err.message}`); return; }
            } else {
              const pull = context.payload.pull_request;
              failures = validate(pull).map((error) => `PR #${pull.number}: ${error}`);
            }

            if (failures.length > 0) {
              core.setFailed(
                '❌ PR must reference an approved issue.\n' +
                'Add "Closes #N", "Fixes #N", "Resolves #N", or "Refs #N" (or OWNER/REPO#N) to every PR body.\n' +
                failures.join('\n')
              );
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify linked issue is approved
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issuePattern = /(?:closes|fixes|resolves|refs)\s+(?:([a-z0-9_.-]+)\/([a-z0-9_.-]+))?#(\d+)/gi;
            const validate = async (pull) => {
              const matches = [...(pull.body || '').matchAll(issuePattern)];
              if (matches.length === 0) return ['no issue reference found'];

              const trustedOwner = context.repo.owner.toLowerCase();
              const errors = [];
              for (const match of matches) {
                const rawOwner = match[1] || context.repo.owner;
                const rawRepo = match[2] || context.repo.repo;
                const owner = rawOwner.toLowerCase();
                const issueNumber = parseInt(match[3], 10);
                const issueRef = match[1] && match[2] ? `${rawOwner}/${rawRepo}#${issueNumber}` : `#${issueNumber}`;

                if (owner !== trustedOwner) {
                  errors.push(`issue ${issueRef}: cross-repository references outside ${context.repo.owner} are not permitted.`);
                  continue;
                }

                core.info(`Checking PR #${pull.number} issue ${issueRef} for status:approved label...`);
                try {
                  const issue = (await github.rest.issues.get({
                    owner: rawOwner,
                    repo: rawRepo,
                    issue_number: issueNumber,
                  })).data;
                  const labels = issue.labels.map((label) => label.name);
                  if (!labels.includes('status:approved')) {
                    errors.push(`issue ${issueRef} ("${issue.title}") does not have the \`status:approved\` label.`);
                  } else {
                    core.info(`✅ PR #${pull.number} issue ${issueRef} has status:approved`);
                  }
                } catch (err) {
                  errors.push(`issue ${issueRef}: could not be fetched (${err.message})`);
                }
              }
              return errors;
            };
            let failures;
            if (context.eventName === 'merge_group') {
              const { aggregatePullRequestResults, resolveAssociatedPullRequests } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/merge-queue.mjs`);
              try {
                const pulls = await resolveAssociatedPullRequests(github, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  baseRef: context.payload.merge_group.base_ref,
                  headRef: context.payload.merge_group.head_ref,
                });
                failures = await aggregatePullRequestResults(pulls, validate);
              } catch (err) { core.setFailed(`❌ Could not fetch queued pull requests: ${err.message}`); return; }
            } else {
              const pull = context.payload.pull_request;
              failures = (await validate(pull)).map((error) => `PR #${pull.number}: ${error}`);
            }

            if (failures.length > 0) {
              core.setFailed('❌ Linked issue(s) not approved:\n' + failures.join('\n'));
            }
