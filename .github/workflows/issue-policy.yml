name: Native Issue Policy

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions: {}

jobs:
  issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Load trusted issue policy (${{ github.workflow_sha }})
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Evaluate issue reference
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 0
          script: |
            try {
              const { evaluateNativeIssuePolicy } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-native-policy.mjs`);
              const verdict = await evaluateNativeIssuePolicy(github, context, 'reference');
              core.info(`reference: ${verdict.conclusion} (${verdict.headSha})`);
              if (verdict.conclusion !== 'success') core.setFailed(verdict.summary);
            } catch (error) {
              core.setFailed(error instanceof Error ? error.message : String(error));
            }
  issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Load trusted issue policy (${{ github.workflow_sha }})
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Evaluate issue approval
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 0
          script: |
            try {
              const { evaluateNativeIssuePolicy } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-native-policy.mjs`);
              const verdict = await evaluateNativeIssuePolicy(github, context, 'approved');
              core.info(`approved: ${verdict.conclusion} (${verdict.headSha})`);
              if (verdict.conclusion !== 'success') core.setFailed(verdict.summary);
            } catch (error) {
              core.setFailed(error instanceof Error ? error.message : String(error));
            }
