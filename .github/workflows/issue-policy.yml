              toJSON(github.event_name), toJSON(github.event.action),
              github.repository_id, github.run_id, github.run_attempt,
              github.event.pull_request.number, github.event.pull_request.head.repo.id,
              toJSON(github.event.pull_request.head.sha), toJSON(github.event.pull_request.head.ref),
