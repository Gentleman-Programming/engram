                try { proofConfig = JSON.parse(process.env.ENGRAM_CI_PROOF_MANIFEST); }
                catch { throw new Error('proof-adapter: configuration'); }
                if (proofConfig?.enabled !== false) {
                  if (proofConfig?.enabled !== true || !proofConfig.target) throw new Error('proof-adapter: configuration');
                    try {
                      const { readFile } = await import('node:fs/promises');
                      const { createHash } = await import('node:crypto');
                      for (const [name, digest] of [['adapter', process.env.CI_PROOF_ADAPTER_SHA], ['controls', process.env.CI_PROOF_CORE_SHA]]) {
                        const path = `${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-ci-proof-${name}.mjs`;
                        const text = (await readFile(path.startsWith('file:') ? new URL(path) : path, 'utf8')).replaceAll('\r\n', '\n');
                        if (createHash('sha256').update(text).digest('hex') !== digest) throw new Error();
                      }
                    } catch { throw new Error('proof-adapter: source'); }
