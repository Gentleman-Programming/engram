# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Baseline: PR #1728, CodeRabbit reply #6084792433 (Repository UI).
# Keep existing settings; only the profile and docstring percentage check differ.
language: en-US
tone_instructions: ''
early_access: false
enable_free_tier: true
inheritance: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  high_level_summary: true
  high_level_summary_instructions: ''
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  review_details: false
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  mutually_exclusive_groups: {}
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - '!go.sum'
    - '!**/*_templ.go'
    - '!**/*.db'
    - '!**/*.db-wal'
    - '!**/*.db-shm'
  path_instructions:
    - path: internal/store/**/*.go
      instructions: Persistence layer. SQL queries live here, never in handlers. No HTTP logic or HTML rendering. Schema changes require a test.
    - path: internal/cloud/cloudstore/**/*.go
      instructions: Cloud persistence. SQL stays here. Cloud is replication, not source of truth (SQLite local is). Admin-enforceable sync policies must be validated server-side and fail loudly, never drop data silently.
    - path: internal/cloud/dashboard/**/*.templ
      instructions: Every modified .templ must have its regenerated *_templ.go committed in the same PR (run templ generate). Never edit *_templ.go by hand. No business logic here.
    - path: plugin/**
      instructions: 'Adapters stay thin: parse input, call the core Go API/tool, return. No business logic, no external runtime deps.'
    - path: internal/server/**/*.go
      instructions: New or modified endpoints need handler tests (parsing/validation) and route+response tests. If a payload or route changes, update docs in the same PR.
    - path: '**/*_test.go'
      instructions: Verify coverage of happy path, error paths, and edge cases. Tests must be deterministic. Behavior changes without tests should be blocked.
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    description_keyword: ''
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    custom: []
  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: off
      threshold: 80
    title:
      mode: warning
      requirements: ''
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks: []
  post_merge_actions: []
  tools:
    ast-grep:
      enabled: true
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
